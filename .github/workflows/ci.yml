name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/**.scala', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Check formatting
        run: sbt "scalafmtCheckAll; scalafmtSbtCheck; it/scalafmtCheckAll"

      - name: Compile
        run: sbt Test/compile

      - name: Test
        run: sbt "testOnly *"

      - name: Integration tests on the next Scala release
        run: sbt "it/testOnly *"

      - name: Compile benchmarks
        run: sbt "benchmarks / Compile / compile"

      - name: Run examples
        shell: bash
        run: |
          mains="BlockingExample CatsEffectExample ZioExample ProvidersExample"
          commands=$(printf 'examples/runMain oauth4s.examples.%s; ' $mains)
          sbt --server -Dsbt.color=false "${commands%; }" | tee examples.log

          expect() {
            awk -v main="oauth4s.examples.$1" '/^\[info\] running \(fork\) / { on = ($NF == main) } on' examples.log | grep -qF -- "$2" \
              || { echo "::error::$1 did not print what it should: $2"; exit 1; }
          }

          expect BlockingExample "blocking: Bearer token for read, asked once: true"
          expect CatsEffectExample "cats-effect: user-1 signed in as user@example.com"
          expect ZioExample "zio: the device was approved for read"
          expect ProvidersExample "providers: vk -> https://id.vk.ru/authorize (PKCE on)"

      - name: Binary compatibility
        run: sbt mimaReportBinaryIssues

  forward-compat:
    name: Next Scala release (-source:future)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt
        uses: actions/cache@v6
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/**.scala', 'project/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Compile
        run: sbt 'set every sourceLevel := "future"; Test/compile'
